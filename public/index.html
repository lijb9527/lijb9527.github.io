<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德州扑克多人在线游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .login-box h1 {
            margin-bottom: 30px;
            color: #ffd700;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            color: #1a1a2e;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .login-box button:hover {
            transform: scale(1.05);
        }

        .game-screen {
            display: none;
            padding: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .room-info {
            font-size: 14px;
        }

        .poker-table {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            margin: 0 auto 20px;
            background: linear-gradient(145deg, #2d5016 0%, #1e3a0f 100%);
            border: 15px solid #8b4513;
            border-radius: 200px;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .table-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .community-cards {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            width: 70px;
            height: 100px;
            background: linear-gradient(145deg, #fff 0%, #f0f0f0 100%);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card.red {
            color: #e74c3c;
        }

        .card.black {
            color: #2c3e50;
        }

        .card-placeholder {
            width: 70px;
            height: 100px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
        }

        .pot-display {
            font-size: 24px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .phase-display {
            font-size: 18px;
            color: #fff;
            margin-top: 10px;
        }

        .player-seat {
            position: absolute;
            width: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 10px;
            transition: all 0.3s;
        }

        .player-seat.active {
            background: rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .player-seat.dealer::before {
            content: 'D';
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ffd700;
            color: #1a1a2e;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .player-seat.folded {
            opacity: 0.5;
        }

        .player-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .player-chips {
            font-size: 12px;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .player-cards {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .player-cards .card {
            width: 50px;
            height: 70px;
            font-size: 16px;
        }

        .player-bet {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 5px;
        }

        .player-seat:nth-child(1) { top: 50%; left: -180px; transform: translateY(-50%); }
        .player-seat:nth-child(2) { top: -50px; left: 50%; transform: translateX(-50%); }
        .player-seat:nth-child(3) { top: 50%; right: -180px; transform: translateY(-50%); }
        .player-seat:nth-child(4) { bottom: -50px; right: 50px; }
        .player-seat:nth-child(5) { bottom: -50px; left: 50px; }
        .player-seat:nth-child(6) { bottom: -50px; left: 50%; transform: translateX(-50%); }

        .controls {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }

        .controls-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .my-cards {
            display: flex;
            gap: 10px;
        }

        .my-cards .card {
            width: 90px;
            height: 130px;
            font-size: 32px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-fold {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .btn-check {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .btn-call {
            background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
            color: white;
        }

        .btn-raise {
            background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);
            color: white;
        }

        .raise-input {
            width: 100px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin-right: 10px;
        }

        .game-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #1a1a2e;
        }

        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
        }

        .winner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .winner-content {
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }

        .winner-content h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .winner-content p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .winner-content button {
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #1a1a2e;
        }

        .waiting-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #ffd700;
            text-align: center;
        }

        @media (max-width: 768px) {
            .poker-table {
                height: 400px;
            }

            .player-seat {
                width: 120px;
            }

            .card {
                width: 50px;
                height: 70px;
                font-size: 16px;
            }

            .my-cards .card {
                width: 60px;
                height: 85px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>🃏 德州扑克</h1>
            <input type="text" id="playerName" placeholder="输入你的名字" maxlength="20">
            <button onclick="joinGame()">进入游戏</button>
        </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="room-info">
                房间: <span id="roomId">-</span>
            </div>
            <div class="room-info">
                玩家: <span id="playerCount">0</span>/8
            </div>
        </div>

        <div class="poker-table" id="pokerTable">
            <div class="waiting-message" id="waitingMessage">
                等待玩家加入...<br>
                至少需要2名玩家才能开始游戏
            </div>

            <div class="table-center" id="tableCenter" style="display: none;">
                <div class="community-cards" id="communityCards"></div>
                <div class="pot-display">底池: $<span id="potAmount">0</span></div>
                <div class="phase-display" id="phaseDisplay">等待中</div>
            </div>

            <div id="playerSeats"></div>
        </div>

        <div class="controls">
            <div class="controls-top">
                <div class="my-cards" id="myCards">
                    <div class="card-placeholder"></div>
                    <div class="card-placeholder"></div>
                </div>
                <button class="game-btn" id="startBtn" onclick="startGame()">开始游戏</button>
            </div>

            <div class="action-buttons" id="actionButtons">
                <button class="action-btn btn-fold" onclick="foldAction()">弃牌</button>
                <button class="action-btn btn-check" onclick="checkAction()">过牌</button>
                <button class="action-btn btn-call" onclick="callAction()">跟注</button>
                <div class="raise-input-container">
                    <input type="number" class="raise-input" id="raiseAmount" min="0" value="0">
                    <button class="action-btn btn-raise" onclick="raiseAction()">加注</button>
                </div>
            </div>
        </div>
    </div>

    <div class="message" id="message"></div>

    <div class="winner-modal" id="winnerModal">
        <div class="winner-content">
            <h2>🎉 游戏结束!</h2>
            <p id="winnerText"></p>
            <button onclick="closeWinnerModal()">继续</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myPlayerId = null;
        let currentRoomId = null;
        let roomData = null;

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('joinedRoom', (data) => {
            myPlayerId = data.playerId;
            currentRoomId = data.roomId;
            document.getElementById('roomId').textContent = currentRoomId;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
        });

        socket.on('roomUpdate', (data) => {
            roomData = data;
            updateUI();
        });

        socket.on('gameUpdate', (data) => {
            roomData = data;
            updateUI();
        });

        socket.on('roundEnded', (data) => {
            const winnerNames = data.winners.map(w => w.name).join(', ');
            document.getElementById('winnerText').textContent = 
                `${winnerNames} 赢得了 $${data.pot}!`;
            document.getElementById('winnerModal').style.display = 'flex';
        });

        socket.on('error', (data) => {
            showMessage(data);
        });

        function joinGame() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) {
                showMessage('请输入你的名字');
                return;
            }
            socket.emit('joinGame', name);
        }

        function startGame() {
            socket.emit('startGame');
        }

        function foldAction() {
            socket.emit('playerAction', { type: 'fold' });
        }

        function checkAction() {
            socket.emit('playerAction', { type: 'check' });
        }

        function callAction() {
            socket.emit('playerAction', { type: 'call' });
        }

        function raiseAction() {
            const amount = parseInt(document.getElementById('raiseAmount').value);
            if (isNaN(amount) || amount <= 0) {
                showMessage('请输入有效的加注金额');
                return;
            }
            socket.emit('playerAction', { type: 'raise', amount });
        }

        function updateUI() {
            if (!roomData) return;

            document.getElementById('playerCount').textContent = roomData.players.length;
            document.getElementById('potAmount').textContent = roomData.pot;

            const phaseNames = {
                'waiting': '等待中',
                'preflop': '翻牌前',
                'flop': '翻牌',
                'turn': '转牌',
                'river': '河牌',
                'ended': '已结束'
            };
            document.getElementById('phaseDisplay').textContent = phaseNames[roomData.phase] || roomData.phase;

            if (roomData.phase === 'waiting' || roomData.players.length < 2) {
                document.getElementById('waitingMessage').style.display = 'block';
                document.getElementById('tableCenter').style.display = 'none';
                document.getElementById('startBtn').disabled = roomData.players.length < 2;
            } else {
                document.getElementById('waitingMessage').style.display = 'none';
                document.getElementById('tableCenter').style.display = 'block';
                document.getElementById('startBtn').disabled = true;
            }

            updateCommunityCards();
            updatePlayerSeats();
            updateMyCards();
            updateActionButtons();
        }

        function updateCommunityCards() {
            const container = document.getElementById('communityCards');
            container.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                if (i < roomData.communityCards.length) {
                    const card = roomData.communityCards[i];
                    container.innerHTML += createCardHTML(card);
                } else {
                    container.innerHTML += '<div class="card-placeholder"></div>';
                }
            }
        }

        function updatePlayerSeats() {
            const container = document.getElementById('playerSeats');
            container.innerHTML = '';

            roomData.players.forEach((player, index) => {
                const isMe = player.id === myPlayerId;
                const isCurrentPlayer = index === roomData.currentPlayerIndex;
                const isDealer = index === roomData.dealerIndex;

                let cardsHTML = '';
                if (player.cards.length > 0) {
                    if (isMe || roomData.phase === 'ended') {
                        cardsHTML = player.cards.map(card => createCardHTML(card, false, true)).join('');
                    } else {
                        cardsHTML = '<div class="card-placeholder" style="width:50px;height:70px;"></div>'.repeat(2);
                    }
                }

                const seatClass = [
                    isCurrentPlayer ? 'active' : '',
                    isDealer ? 'dealer' : '',
                    player.folded ? 'folded' : ''
                ].filter(Boolean).join(' ');

                container.innerHTML += `
                    <div class="player-seat ${seatClass}">
                        <div class="player-name">${player.name} ${isMe ? '(你)' : ''}</div>
                        <div class="player-chips">$${player.chips}</div>
                        <div class="player-cards">${cardsHTML}</div>
                        ${player.currentBet > 0 ? `<div class="player-bet">下注: $${player.currentBet}</div>` : ''}
                        ${player.allIn ? '<div class="player-bet" style="color:#ffd700;">All In!</div>' : ''}
                    </div>
                `;
            });
        }

        function updateMyCards() {
            const container = document.getElementById('myCards');
            const me = roomData.players.find(p => p.id === myPlayerId);

            if (me && me.cards.length > 0) {
                container.innerHTML = me.cards.map(card => createCardHTML(card)).join('');
            } else {
                container.innerHTML = '<div class="card-placeholder"></div><div class="card-placeholder"></div>';
            }
        }

        function updateActionButtons() {
            const buttons = document.querySelectorAll('.action-btn');
            const me = roomData.players.find(p => p.id === myPlayerId);
            const isMyTurn = roomData.currentPlayerIndex === roomData.players.indexOf(me);

            buttons.forEach(btn => {
                btn.disabled = !isMyTurn || roomData.phase === 'waiting' || roomData.phase === 'ended';
            });

            if (me) {
                const callAmount = roomData.currentBet - me.currentBet;
                const minRaise = roomData.currentBet + roomData.bigBlind;
                document.getElementById('raiseAmount').min = minRaise;
                document.getElementById('raiseAmount').max = me.chips;
                document.getElementById('raiseAmount').value = minRaise;
            }
        }

        function createCardHTML(card, fullSize = false, small = false) {
            const colorClass = (card.suit === '♥' || card.suit === '♦') ? 'red' : 'black';
            const sizeClass = small ? 'style="width:50px;height:70px;font-size:16px;"' : '';
            return `<div class="card ${colorClass}" ${sizeClass}>
                <div>${card.value}</div>
                <div>${card.suit}</div>
            </div>`;
        }

        function showMessage(text) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }

        function closeWinnerModal() {
            document.getElementById('winnerModal').style.display = 'none';
        }

        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                joinGame();
            }
        });
    </script>
</body>
</html>
